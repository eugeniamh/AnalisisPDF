<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Monitor de Medios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<div class="container py-5">
    <div class="card shadow p-4">
        <h2 class="mb-3">Monitor Inteligente de Medios</h2>
        <p>Sube un PDF de notas periodísticas para detectar posibles focos rojos.</p>

        <form action="/procesar" method="POST" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label">Archivo PDF</label>
                <input type="file" name="pdf" accept=".pdf" class="form-control" required>
            </div>

            <button class="btn btn-primary">Procesar documento</button>
        </form>
    </div>
</div>
</body>
</html>
